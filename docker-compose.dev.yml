services:
  db:
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data # Volume separado para Dev

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app # Hot-reload do Python
      - media_volume_dev:/app/media
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}

  frontend:
    command: quasar dev -m pwa --port 9000 --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1 # Caminho relativo via proxy Nginx (funciona em localhost e IP da rede)
    stop_grace_period: 2s # Se não fechar em 2s, mata logo.

  nginx:
    ports:
      - "8080:80" # Dev roda na porta 8080
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # Config com WebSocket
      - media_volume_dev:/var/www/media:ro
    stop_grace_period: 2s # Se não fechar em 2s, mata logo.

volumes:
  postgres_data_dev:
  media_volume_dev: